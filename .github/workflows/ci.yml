name: CI

# Runs the same three gates a contributor runs locally: lint, types, tests.
# Nothing here publishes anything - see release.yml, which is manual.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref. The suite takes
  # half an hour; queueing every intermediate commit wastes most of it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests tools

      - name: Mypy
        run: mypy src/omr_scanner

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the supported platform and the one the release is built
        # on. Linux runs too, headless, because it catches anything that
        # accidentally depends on a Windows path or a native Qt platform -
        # and it is the faster of the two.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Qt's Linux dependencies
        if: runner.os == 'Linux'
        # PySide6 needs these shared libraries present even to run offscreen;
        # without them every GUI test errors at import.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Tests
        # The GUI suite needs a Qt platform plugin. `tests/gui/conftest.py`
        # selects offscreen automatically on a headless runner; setting it
        # explicitly means a Windows runner - which has a desktop and would
        # otherwise open real windows - behaves the same way.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  package:
    name: Packaging smoke test
    runs-on: windows-latest
    # Only after the tests pass: a 280 MB bundle built from a broken tree is
    # of no use to anyone.
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # The build records the source commit, which needs real history
          # rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Build the application bundle
        run: .\scripts\release\Build-App.ps1 -Clean
        shell: pwsh

      - name: Verify the bundle
        # Not the full smoke test: a CI runner has no interactive desktop, so
        # the application cannot be launched and its window read. This checks
        # everything that does not need one - the executable exists, reports
        # the right version, and every bundled resource came along.
        run: |
          $version = & .\scripts\release\Get-OMRFlowVersion.ps1
          $exe = 'dist\OMRFlow\OMRFlow.exe'
          if (-not (Test-Path $exe)) { throw "No executable at $exe" }
          $reported = ((Get-Item $exe).VersionInfo.ProductVersion ?? '').Trim()
          if ($reported -ne $version.Version) {
            throw "Executable reports '$reported', package says '$($version.Version)'"
          }
          $required = @(
            'dist\OMRFlow\_internal\omr_scanner\gui\resources\branding\logo.svg',
            'dist\OMRFlow\_internal\omr_scanner\gui\resources\branding\icon.ico',
            'dist\OMRFlow\_internal\omr_scanner\gui\resources\icons\lucide\menu.svg'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing from the bundle: $path" }
          }
          Write-Host "Bundle verified: OMRFlow $reported"
        shell: pwsh

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: omrflow-bundle-${{ github.sha }}
          path: dist/OMRFlow/
          retention-days: 7
          # Large and reproducible; kept briefly so a maintainer can pull one
          # down to smoke-test on a real desktop, which CI cannot do.
          if-no-files-found: error

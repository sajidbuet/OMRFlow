name: Release

# Builds and verifies a release, then attaches the artifacts to a GitHub
# release as a DRAFT.
#
# Nothing here publishes on its own. It does not run on an ordinary push, and
# even when a tag triggers it the release is created as a draft and, for any
# prerelease version, flagged as a pre-release. Making it visible is a
# deliberate click by the maintainer, after checking the artifacts.
#
# See docs/release/RELEASE_CHECKLIST.md for the whole procedure.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_draft:
        description: "Create a draft GitHub release for the current tag"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = & .\scripts\release\Get-OMRFlowVersion.ps1
          "version=$($v.Version)"           >> $env:GITHUB_OUTPUT
          "tag=$($v.Tag)"                   >> $env:GITHUB_OUTPUT
          "is_prerelease=$($v.IsPrerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "OMRFlow $($v.Version) - $($v.Channel) channel"

      # A tag that disagrees with `_version.py` would produce an artifact
      # whose filename and contents contradict each other. Refusing here is
      # far cheaper than discovering it after publication.
      - name: The tag must match the version in the source
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = '${{ steps.version.outputs.tag }}'
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match the source version's tag '$expected'. Fix src/omr_scanner/_version.py or the tag."
          }
          Write-Host "Tag $tag matches the source."

      - name: Lint and type check
        run: |
          ruff check src tests
          mypy src/omr_scanner

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build the application bundle
        run: .\scripts\release\Build-App.ps1 -Clean
        shell: pwsh

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup is not on the runner image.
          winget install --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements --disable-interactivity --silent
          .\scripts\release\Build-Installer.ps1

      - name: Generate checksums
        run: .\scripts\release\New-Checksums.ps1
        shell: pwsh

      - name: Verify the release artifacts
        run: .\scripts\release\Invoke-ReleaseVerification.ps1
        shell: pwsh

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omrflow-release-${{ steps.version.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

  draft-release:
    name: Create a draft release
    runs-on: ubuntu-latest
    needs: verify
    # Only for a tag, or when explicitly asked for. Never on a branch push.
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_draft
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: omrflow-release-${{ needs.verify.outputs.version }}
          path: artifacts

      - name: Create the draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: OMRFlow ${{ needs.verify.outputs.version }}
          # A draft: it is not visible, and no one can download it, until the
          # maintainer reviews the artifacts and presses publish.
          draft: true
          # Derived from the version, so an Alpha or Beta can never be
          # published as the latest stable release by accident.
          prerelease: ${{ needs.verify.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.is_prerelease == 'false' }}
          body_path: docs/release/RELEASE_NOTES_TEMPLATE.md
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: What to do next
        run: |
          echo "A DRAFT release has been created for ${{ needs.verify.outputs.tag }}."
          echo "It is not public yet. Before publishing:"
          echo "  1. Replace the release notes template with the real notes."
          echo "  2. Download the installer and verify its SHA-256 against SHA256SUMS.txt."
          echo "  3. Install it on a clean machine - docs/release/CLEAN_MACHINE_TEST.md."
          echo "  4. Confirm 'This is a pre-release' is ticked for an Alpha or Beta."
          echo "  5. Press Publish release."

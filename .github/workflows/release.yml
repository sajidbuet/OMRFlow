name: Release

# Builds and publishes a release from its tag, and nothing else builds one.
#
# The order is the whole point: validate, test on both platforms, build the
# installer, verify it, checksum it, and only then create the GitHub release.
# A failure anywhere leaves no release and no downloadable artifact for that
# tag, which is what "fail closed" has to mean for something people install.
#
# The release is created already published, not as a draft. Zenodo archives a
# repository when GitHub *publishes* a release; a draft is invisible to it, so
# a draft would silently skip the archival this project depends on.
#
# Tags are immutable here. The publish job refuses to touch a release that
# already exists rather than replacing a binary somebody may already have
# downloaded and checksummed.
#
# See docs/release/RELEASE_CHECKLIST.md. The tag is normally created by
# scripts/release.ps1, which runs the same gates locally first.

on:
  push:
    tags:
      - "v*"

concurrency:
  # One release per tag. A re-run of the same tag queues behind the first
  # rather than racing it to create the release.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step: release.py reads the version with `ast` and imports
      # nothing from the package, so this works on a bare checkout.
      - name: Read the version from the tagged source
        id: version
        run: |
          version="$(python scripts/release.py --current-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"    >> "$GITHUB_OUTPUT"
          case "$version" in
            *-alpha.*|*-beta.*|*-rc.*) echo "is_prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)                         echo "is_prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Tagged source declares $version"

      # A tag that disagrees with the source would produce an installer whose
      # filename and contents contradict each other. Cheaper to refuse here
      # than to discover it after publication.
      - name: The tag must match the version in the source
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.version.outputs.tag }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the source version's tag ${{ steps.version.outputs.tag }}."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} matches the source."

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::A GitHub release for ${{ github.ref_name }} already exists. Published releases are immutable; release a new version instead."
            exit 1
          fi
          echo "No existing release for ${{ github.ref_name }}."

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests tools scripts

      - name: Mypy
        run: mypy src/omr_scanner

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, exactly as CI runs them. The installer is Windows
        # only, but a release is not publishable because Windows packaging
        # succeeded while the cross-platform suite is failing - Ubuntu has
        # caught real defects that Windows did not.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Qt's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  package:
    name: Build the installer
    runs-on: windows-latest
    # Every gate first. A 280 MB installer built from a tree that fails its
    # own tests is worse than no installer, because it looks finished.
    needs: [validate, lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          # The build records the source commit, which needs real history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,packaging]"

      - name: Build the application bundle
        run: .\scripts\release\Build-App.ps1 -Clean
        shell: pwsh

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup is not on the runner image.
          winget install --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements --disable-interactivity --silent
          .\scripts\release\Build-Installer.ps1

      - name: Generate checksums
        run: .\scripts\release\New-Checksums.ps1
        shell: pwsh

      - name: Verify the release artifacts
        run: .\scripts\release\Invoke-ReleaseVerification.ps1
        shell: pwsh

      - name: The installer must exist, be named for this version, and be real
        shell: pwsh
        run: |
          $expected = "OMRFlow-${{ needs.validate.outputs.version }}-Setup-x64.exe"
          $installer = Join-Path 'dist\installer' $expected
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer $expected was not produced."
          }
          $size = (Get-Item -LiteralPath $installer).Length
          if ($size -lt 1MB) {
            throw "$expected is only $size bytes, which cannot be a complete installer."
          }
          $sums = 'dist\installer\SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sums)) { throw "SHA256SUMS.txt was not produced." }
          if (-not (Select-String -LiteralPath $sums -SimpleMatch $expected -Quiet)) {
            throw "SHA256SUMS.txt does not mention $expected."
          }
          Write-Host "Verified $expected ($([math]::Round($size / 1MB, 1)) MB)"
          Get-Content $sums

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omrflow-release-${{ needs.validate.outputs.version }}
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    runs-on: ubuntu-latest
    needs: [validate, lint, test, package]
    permissions:
      # The only job that can write. Everything above runs read-only, so a
      # failure in a build or test step cannot create or alter a release.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: omrflow-release-${{ needs.validate.outputs.version }}
          path: artifacts

      - name: Nothing may already exist for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::A release for ${{ github.ref_name }} appeared while this workflow was running. Refusing to overwrite it."
            exit 1
          fi

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: OMRFlow ${{ github.ref_name }}
          # Published, not a draft: Zenodo archives on publication, and a
          # draft would never reach it.
          draft: false
          # Generated from the commits and pull requests since the previous
          # tag. Deterministic, and it needs nobody to write prose for a
          # routine alpha.
          generate_release_notes: true
          # Derived from the version, so an alpha can never be presented as
          # the latest stable release.
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.is_prerelease == 'false' }}
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: Where it went
        run: |
          echo "Published https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          echo "Zenodo archives the release from here; the DOI appears on the Zenodo record once it has."

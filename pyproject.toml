[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omrflow"
# Read from `src/omr_scanner/_version.py`, which is the single place the
# version is written down - see `[tool.setuptools.dynamic]` below. Declaring
# it statically here as well is how the package metadata and the running
# application come to disagree.
dynamic = ["version"]
description = "Template-driven OMR examination processing and result management system"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sajid Muhaimin Choudhury" }]
keywords = ["omr", "optical-mark-recognition", "examination", "assessment", "pyside6"]
classifiers = [
    # Matches the release channel `_version.py` derives from the version
    # string. Moved from "2 - Pre-Alpha" when 0.1.0-alpha.1 made the first
    # externally installable build.
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Testing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Runtime dependencies for the whole committed roadmap (see development/ROADMAP.md).
# The phase that first *uses* each package is noted so that nothing looks accidental.
dependencies = [
    "PySide6>=6.7",        # Phase 0 - desktop GUI shell
    "SQLAlchemy>=2.0",     # Phase 0 - project database access
    "pydantic>=2.7",       # Phase 0 - configuration and template validation
    # opencv-python-headless (not opencv-python) is deliberate: the non-headless
    # wheel bundles its own Qt plugins, which can shadow the PySide6 plugins and
    # break GUI startup. OMRFlow renders through Qt, never through cv2.imshow.
    "opencv-python-headless>=4.9",  # Phase 1 - imaging pipeline
    "numpy>=1.26",                  # Phase 1 - imaging / bubble metrics
    "pandas>=2.2",                  # Phase 7 - candidate list import/export
    "openpyxl>=3.1",                # Phase 9 - Excel reporting
    # Pillow is openpyxl's image backend, and is required rather than optional:
    # without it openpyxl cannot decode the images in a workbook it loads, and
    # *silently drops them on save*. Since a result workbook is generated by
    # copying an examination office's own attendance/result template and
    # writing into the copy, that would delete the institution's logo from its
    # own official report. Measured, not assumed - see
    # `tests/unit/test_meritwise_workbook.py::TestLogo`.
    "pillow>=10",                   # Excel image (logo) preservation
    # Phase 10 - cross-platform PID liveness (project locking, task-lease
    # recovery) and process/system telemetry (CPU, RAM, disk) for the
    # production-hardening benchmark. No heavier monitoring stack is used.
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Only the tests use it, to read `.github/workflows/*.yml` and assert the
    # release pipeline's shape - that publication needs every gate, that only
    # the publishing job can write. A broken release workflow is discovered at
    # the exact moment it is least welcome, so it is checked like any other
    # code rather than by reading it.
    "PyYAML>=6.0",
]
# Needed only to produce a distributable Windows build, not to develop or
# test OMRFlow - see `docs/wiki/Release-Process.md`. The Windows installer
# additionally needs Inno Setup 6, which is not a Python package and is
# installed separately (`winget install --id JRSoftware.InnoSetup`).
packaging = [
    "pyinstaller>=6.6",
]
# Needed only to run the local release-qualification framework under
# `tools/release_validation`, not to develop, test or package OMRFlow - see
# `tools/release_validation/README.md`. Kept apart from `dev` because these are
# Windows-desktop automation libraries: they are of no use on a CI runner with
# no desktop, and a contributor who is not qualifying a release should not have
# to install them.
#
#   pywinauto  drives the *packaged* application through Windows UI Automation,
#              which is the only way to check the thing a user downloads rather
#              than the source it was built from.
#   pillow     compares screenshots against the committed visual baselines.
#              Already a runtime dependency; named here so the group is honest
#              about what it needs rather than relying on that.
validation = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pywinauto>=0.6.8",
    "pillow>=10",
]

[project.scripts]
omrflow = "omr_scanner.main:main"

[project.gui-scripts]
omrflow-gui = "omr_scanner.main:main"

[project.urls]
Homepage = "https://github.com/sajidbuet/OMRflow"
Documentation = "https://github.com/sajidbuet/OMRflow/tree/main/docs"

[tool.setuptools.dynamic]
# The single source of truth for the application version. `0.1.0-alpha.1` is
# both a Semantic Versioning prerelease and a valid PEP 440 one, which
# packaging normalises to `0.1.0a1` for wheel and sdist filenames - so the
# Git tag, the installer name and the About dialog can all use the SemVer
# spelling while pip sees something it accepts, from one constant.
version = { attr = "omr_scanner._version.__version__" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The `gui/resources/icons/lucide/*` glob bundles the toolbar icons (SVG files
# plus their upstream LICENSE) inside the installable package, rather than the
# top-level `resources/` directory - which is dev/test fixtures only and is
# never packaged - so icons resolve correctly for an editable install, a
# built wheel, and a future frozen executable alike. See
# `src/omr_scanner/gui/icons.py`. `gui/resources/branding/*` bundles the logo
# and application icon the same way - see `src/omr_scanner/gui/branding.py`.
omr_scanner = [
    "py.typed",
    "gui/resources/icons/lucide/*.svg",
    "gui/resources/icons/lucide/LICENSE",
    "gui/resources/branding/*.svg",
    "gui/resources/branding/*.ico",
    "gui/resources/branding/*.png",
    # Phase 7: the candidate/attendance sample workbook the Attendance stage
    # offers to save. Inside the package for the same reason as the icons -
    # "Download Sample Template..." has to work in an installed application,
    # and the top-level `resources/` directory is never shipped. See
    # `src/omr_scanner/services/candidate_import.py`.
    "resources/templates/*.xlsx",
]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The repository root, so that `from tests.report_fixtures import ...` resolves.
# `tests/` is deliberately not a package - no `__init__.py`, so test module
# names stay short - but several suites share fixtures through `tests.*`, and
# that import needs the root on `sys.path`.
#
# Without this it works under `python -m pytest`, which prepends the working
# directory, and fails under plain `pytest`, which does not. That is the
# command CONTRIBUTING.md, docs/TESTING.md and the CI workflow all use, so the
# suite collected 30+ ImportErrors everywhere except the one wrapper script
# that happened to invoke it the other way.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config -m \"not stress\""
markers = [
    "gui: tests that instantiate Qt widgets (require a usable Qt platform plugin)",
    "stress: large-scale (thousands of sheets) production-hardening runs; excluded from the default test run by addopts, run explicitly with `-m stress`",
]
filterwarnings = ["error::DeprecationWarning:omr_scanner.*"]

# --------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # flake8-use-pathlib (project rule: no os.path string juggling)
    "ARG",      # unused arguments
    "RUF",      # ruff-specific
    "D",        # pydocstyle - module/class/function docstrings are a project requirement
    "ANN",      # flake8-annotations - type hints are a project requirement
]
ignore = [
    "D206",  # conflicts with the formatter (indent-with-spaces)
    "W191",  # conflicts with the formatter (tab-indentation)
    "ANN401",  # `Any` is occasionally unavoidable at Qt/SQLAlchemy boundaries
    # Constructor arguments are documented in the class docstring's Args section,
    # as the Google style guide prescribes; a second docstring on __init__ would
    # duplicate them and drift.
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# Qt method overrides must keep Qt's camelCase spelling.
extend-ignore-names = [
    "closeEvent", "showEvent", "resizeEvent", "keyPressEvent", "paintEvent",
    "mousePressEvent", "mouseMoveEvent", "mouseReleaseEvent", "mouseDoubleClickEvent",
    "hoverEnterEvent", "hoverMoveEvent", "hoverLeaveEvent", "wheelEvent",
    "keyReleaseEvent", "drawBackground", "drawForeground",
    "dragEnterEvent", "dragMoveEvent", "dragLeaveEvent", "dropEvent",
    "contextMenuEvent", "itemChange", "boundingRect", "sceneEvent", "eventFilter",
    "rowCount", "columnCount", "headerData",
    # The custom-painted shell widgets (workflow navigator, chevron steps,
    # cards) override Qt's own measurement and hit-testing entry points.
    "changeEvent", "enterEvent", "leaveEvent",
    "sizeHint", "minimumSizeHint", "heightForWidth", "hitButton",
]

[tool.ruff.lint.per-file-ignores]
# Tests are self-describing through their names; module docstrings are still
# required (D100 stays on) but per-test docstrings would be noise.
# ARG001/ARG002: a pytest fixture is frequently requested only for its side
# effect (isolation, sandboxing, "make a conflict exist"), which ruff cannot
# distinguish from a dead parameter. ARG002 is the same situation for a test
# written as a method of a Test* class, which is most of them.
"tests/*" = ["D103", "D101", "D102", "ANN201", "ANN001", "ARG001", "ARG002"]
# The release-qualification suites are pytest files and get the same
# allowances as `tests/` for the same reasons.
"tools/release_validation/suites/*" = [
    "D103", "D101", "D102", "ANN201", "ANN001", "ARG001", "ARG002",
]
# The framework's own modules are held to the project's standard, except that
# `BLE001` is not enabled here and several places deliberately catch
# `Exception`: a qualification stage that let an exception escape would
# destroy the run and its report, which is the one thing it must never do.
"tools/release_validation/*" = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# Qt slots frequently take default arguments supplied by the signal.
# `QModelIndex()` is Qt's own spelling for "the invisible root", the
# documented default for `rowCount`/`columnCount` overrides.
extend-immutable-calls = ["pathlib.Path", "PySide6.QtCore.QModelIndex"]

# --------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/omr_scanner"]
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# PySide6 ships .pyi stubs, but they are generated and incomplete; Qt's
# signal/slot machinery is not expressible in the type system. Untyped Qt
# internals must not be allowed to weaken checking of our own code, so we only
# relax the "subclassing Any" / "untyped import" errors at that boundary.
module = ["PySide6.*"]
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# openpyxl ships no type information and has no stubs in the project's
# dependency set. Every module that touches it - `services/candidate_import.py`
# (Phase 7, reading a roster) and `services/report_template.py`,
# `reporting/excel.py` (Phase 9, reading and building result workbooks) -
# keeps the untyped boundary local: an openpyxl object is typed `Any` at the
# point it is opened and never returned from a function whose own signature
# is fully typed, so nothing untyped escapes into the rest of the codebase.
# Adding `types-openpyxl` for that would be a dependency for a handful of
# narrow call sites; relaxing it here does not weaken checking of any other
# OMRFlow code.
module = ["openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["omr_scanner.gui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# psutil ships no bundled type stubs and `types-psutil` is a separate package
# this project's dependency set does not carry; the untyped boundary is kept
# local to the handful of Phase 10 modules that call it (process/PID liveness,
# telemetry), exactly like the openpyxl override above.
module = ["psutil.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# This module intentionally branches on sys.platform. mypy analyses one platform
# at a time and therefore reports the branches for the other platforms as
# unreachable; the code is correct and must stay cross-platform.
module = ["omr_scanner.config.paths"]
warn_unreachable = false
